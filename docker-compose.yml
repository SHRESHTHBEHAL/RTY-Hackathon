services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gaitway
      POSTGRES_PASSWORD: gaitway
      POSTGRES_DB: gaitway
    ports:
      - "${GAITWAY_PG_PORT:-5432}:5432"
    volumes:
      - gaitway-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gaitway -d gaitway"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  gaitway-pg:
